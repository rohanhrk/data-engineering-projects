[project]
name = "productpulse-ai"
version = "0.1.0"
description = "Databricks Free Edition retail product intelligence and support copilot."
requires-python = ">=3.10"
dependencies = [
  "databricks-sdk>=0.89.0",
  "databricks-sql-connector>=4.0.0",
  "pg8000>=1.31.0",
  "pandas>=2.2.0",
  "streamlit>=1.37.0",
  "python-dotenv>=1.0.1",
  "pypdf>=4.3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
