  <!-- Labels on key branches -->
  <rect x="1254" y="770" width="172" height="32" rx="16" class="pill"/>
  <text x="1273" y="791" class="tiny">SQL-only branch</text>
  <rect x="1254" y="952" width="182" height="32" rx="16" class="pill"/>
  <text x="1273" y="973" class="tiny">RAG sync branch</text>
  <rect x="2190" y="905" width="78" height="32" rx="16" class="pill"/>
  <text x="2207" y="926" class="tiny">trace</text>
</svg>
