<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">ProductPulse AI Architecture</title>
  <desc id="desc">End-to-end Databricks Free Edition architecture for a retail product intelligence and support copilot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#eef5ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102030" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#32506b"/>
    </marker>
    <style>
      .label{font-family:Inter,Arial,sans-serif;font-size:24px;font-weight:700;fill:#17324d}
      .small{font-family:Inter,Arial,sans-serif;font-size:17px;fill:#31465f}
      .tiny{font-family:Inter,Arial,sans-serif;font-size:14px;fill:#4e6072}
      .lane{fill:#ffffff;stroke:#ccdae6;stroke-width:2;filter:url(#shadow)}
      .box{rx:16;fill:#ffffff;stroke:#93a9bc;stroke-width:2}
      .blue{fill:#e7f1ff;stroke:#5f8ec3}
      .green{fill:#e8f6ed;stroke:#65a875}
      .yellow{fill:#fff6da;stroke:#c6a347}
      .red{fill:#ffefed;stroke:#c86b63}
      .purple{fill:#f2eefe;stroke:#8c79c8}
      .arrow{stroke:#32506b;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#6a7d90;stroke-width:2;fill:none;stroke-dasharray:8 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <text x="70" y="70" class="label" font-size="32">ProductPulse AI - Databricks Free Edition Architecture</text>
  <text x="70" y="102" class="small">Lakehouse pipeline + Lakebase vector memory + Databricks-hosted LLM + Streamlit Databricks App</text>

  <rect x="55" y="145" width="290" height="650" rx="24" class="lane"/>
  <text x="85" y="190" class="label">Retail Sources</text>
  <rect x="85" y="230" width="230" height="74" class="box blue"/>
  <text x="110" y="260" class="small" font-weight="700">Customer Reviews</text>
  <text x="110" y="285" class="tiny">274 ratings, sentiment, issues</text>
  <rect x="85" y="330" width="230" height="74" class="box blue"/>
  <text x="110" y="360" class="small" font-weight="700">Support Tickets</text>
  <text x="110" y="385" class="tiny">143 returns, warranty, advice</text>
  <rect x="85" y="430" width="230" height="74" class="box blue"/>
  <text x="110" y="460" class="small" font-weight="700">Retail Operations</text>
  <text x="110" y="485" class="tiny">products, orders, returns, stock</text>
  <rect x="85" y="530" width="230" height="94" class="box blue"/>
  <text x="110" y="560" class="small" font-weight="700">Internal PDFs</text>
  <text x="110" y="585" class="tiny">policy, SOP, QA, briefs</text>
  <text x="110" y="610" class="tiny">extracted as unstructured text</text>

  <rect x="390" y="145" width="340" height="650" rx="24" class="lane"/>
  <text x="420" y="190" class="label">Lakehouse Pipeline</text>
  <rect x="425" y="230" width="270" height="82" class="box yellow"/>
  <text x="455" y="262" class="small" font-weight="700">UC Volume</text>
  <text x="455" y="288" class="tiny">/Volumes/catalog/schema/raw_data</text>
  <rect x="425" y="350" width="270" height="82" class="box green"/>
  <text x="455" y="382" class="small" font-weight="700">Bronze Delta</text>
  <text x="455" y="408" class="tiny">raw reviews, tickets, docs</text>
  <rect x="425" y="470" width="270" height="82" class="box green"/>
  <text x="455" y="502" class="small" font-weight="700">Silver Chunks</text>
  <text x="455" y="528" class="tiny">citable RAG text + metadata</text>
  <rect x="425" y="590" width="270" height="82" class="box green"/>
  <text x="455" y="622" class="small" font-weight="700">Gold Metrics</text>
  <text x="455" y="648" class="tiny">product daily + issue daily</text>

  <rect x="780" y="145" width="285" height="650" rx="24" class="lane"/>
  <text x="810" y="190" class="label">AI + Lakebase</text>
  <rect x="815" y="235" width="215" height="86" class="box purple"/>
  <text x="845" y="267" class="small" font-weight="700">Embedding API</text>
  <text x="845" y="293" class="tiny">databricks-qwen3-embedding-0-6b</text>
  <rect x="815" y="360" width="215" height="92" class="box red"/>
  <text x="845" y="392" class="small" font-weight="700">Lakebase pgvector</text>
  <text x="845" y="418" class="tiny">standard vector extension</text>
  <rect x="815" y="490" width="215" height="92" class="box red"/>
  <text x="845" y="522" class="small" font-weight="700">Agent Memory</text>
  <text x="845" y="548" class="tiny">conversation_memory table</text>
  <rect x="815" y="620" width="215" height="86" class="box purple"/>
  <text x="845" y="652" class="small" font-weight="700">Chat LLM</text>
  <text x="845" y="678" class="tiny">Llama 3.3 70B endpoint</text>

  <rect x="1110" y="145" width="235" height="650" rx="24" class="lane"/>
  <text x="1140" y="190" class="label">Experience</text>
  <rect x="1140" y="255" width="175" height="92" class="box blue"/>
  <text x="1165" y="287" class="small" font-weight="700">Agent API</text>
  <text x="1165" y="313" class="tiny">planner + tools</text>
  <rect x="1140" y="410" width="175" height="92" class="box blue"/>
  <text x="1165" y="442" class="small" font-weight="700">Streamlit App</text>
  <text x="1165" y="468" class="tiny">Databricks Apps</text>
  <rect x="1140" y="565" width="175" height="112" class="box blue"/>
  <text x="1165" y="597" class="small" font-weight="700">Business Users</text>
  <text x="1165" y="623" class="tiny">PM, support, category</text>
  <text x="1165" y="649" class="tiny">managers, architects</text>

  <path class="arrow" d="M315 267 C355 267 375 267 425 267"/>
  <path class="arrow" d="M315 367 C355 367 375 367 425 391"/>
  <path class="arrow" d="M315 467 C355 467 375 467 425 391"/>
  <path class="arrow" d="M315 577 C355 577 375 535 425 511"/>
  <path class="arrow" d="M560 312 L560 350"/>
  <path class="arrow" d="M560 432 L560 470"/>
  <path class="arrow" d="M560 552 L560 590"/>
  <path class="arrow" d="M695 511 C750 511 765 278 815 278"/>
  <path class="arrow" d="M1030 406 C1090 406 1095 301 1140 301"/>
  <path class="arrow" d="M1030 536 C1090 536 1095 301 1140 301"/>
  <path class="arrow" d="M1030 663 C1090 663 1095 301 1140 301"/>
  <path class="arrow" d="M1228 347 L1228 410"/>
  <path class="arrow" d="M1228 502 L1228 565"/>
  <path class="dash" d="M695 631 C790 740 1110 740 1228 677"/>

  <rect x="395" y="820" width="620" height="44" rx="12" fill="#ffffff" stroke="#ccd9e4"/>
  <text x="420" y="848" class="tiny">Scheduled job: setup -> bronze ingest -> silver chunks -> gold metrics + Lakebase embedding sync</text>
</svg>
